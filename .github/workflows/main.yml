name: Build Chronos APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Chronos-Android-Starter-Project*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -o 'Chronos-Android-Starter-Project*.zip' -d extracted

          PROJECT_FILE="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (cmdline tools + platform + build-tools)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget
          mkdir -p "$HOME/Android/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d cmdline
          mkdir -p "$HOME/Android/cmdline-tools/latest"
          mv cmdline/cmd
